<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu pase — Sótano</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0b10">
<link rel="icon" href="/iconos/icono-club.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/iconos/apple-touch-icon-club.png">
<!-- El pase es Sótano Club: manifest propio, ícono propio y nombre
     propio. En la pantalla de inicio hay tres de la casa —la carta, la barra
     y esta— y tienen que distinguirse sin leer. -->
<link rel="manifest" href="/manifest-club.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sótano Club">
<link rel="stylesheet" href="/estilos.css">
</head>
<body>

<header class="tope">
  <a class="marca" href="/" aria-label="Sótano"><img src="/iconos/logo-horizontal.svg" alt="Sótano" width="443" height="120"></a>
</header>

<main class="envoltorio" style="padding-bottom:2rem">
  <!-- Si lo que corre quedó viejo, el invitado tiene que poder destrabarlo
       solo: es la pantalla que más se abre desde un celular ajeno, una vez,
       con la versión que le haya quedado guardada. -->
  <div class="aviso oculto" id="avisoVersion">
    <span>⬆</span>
    <div style="flex:1"><b>Hay una versión nueva.</b> Tocá actualizar para traerla.</div>
    <button class="btn primario" data-actualizar style="padding:.4rem .8rem">Actualizar</button>
  </div>

  <div id="pase"><div class="cargando">Buscando tu pase…</div></div>

  <!-- Se ofrece instalar recién acá: el momento en que sirve es cuando ya
       tiene su pase, no antes de anotarse. Si ya está instalada, se esconde
       sola. -->
  <div class="instalar oculto" id="cajaInstalarClub">
    <b>Guardalo en tu celular</b>
    <span style="color:var(--suave);font-size:.9rem">Queda como una app: entrás
      a tu pase de una, sin buscar el link, y ahí te enterás de la próxima noche.</span>
    <button class="btn primario ancho-full" data-instalar-btn>⬇ Instalar Sótano Club</button>
  </div>
</main>

<dialog id="dlgInstalar">
  <h2 style="margin-top:0">Instalar Sótano Club</h2>
  <p style="color:var(--suave);font-size:.9rem;margin-top:0">
    Queda como una app más en tu celular y abre directo en tu pase.
  </p>
  <div id="pasosInstalar" style="font-size:.92rem;line-height:1.6"></div>
  <button class="btn primario ancho-full" id="btnCerrarInstalar" style="margin-top:1.2rem">Listo</button>
</dialog>

<script src="/version.js"></script>
<script src="/config.js"></script>
<script type="module" src="/pase.js"></script>
<script src="/instalar.js"></script>
<script src="/actualizar.js"></script>
</body>
</html>
