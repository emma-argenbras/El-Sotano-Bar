<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reservá tu lugar — El Sótano</title>
<meta name="description" content="Registrate para la noche en El Sótano.">
<meta name="theme-color" content="#0d0b10">
<link rel="icon" href="/iconos/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png">
<link rel="stylesheet" href="/estilos.css">
</head>
<body>

<header class="tope">
  <a class="marca" href="/" aria-label="El Sótano"><img src="/iconos/logo-horizontal.svg" alt="El Sótano" width="560" height="120"></a>
</header>

<main class="envoltorio" style="padding-bottom:2rem">
  <!-- Si lo que corre quedó viejo, el invitado tiene que poder destrabarlo
       solo: es la pantalla que más se abre desde un celular ajeno, una vez,
       con la versión que le haya quedado guardada. -->
  <div class="aviso oculto" id="avisoVersion">
    <span>⬆</span>
    <div style="flex:1"><b>Hay una versión nueva.</b> Tocá actualizar para traerla.</div>
    <button class="btn primario" data-actualizar style="padding:.4rem .8rem">Actualizar</button>
  </div>

  <div id="pantalla"><div class="cargando">Buscando la noche…</div></div>
</main>

<script src="/version.js"></script>
<script src="/config.js"></script>
<script type="module" src="/registro.js"></script>
<script src="/actualizar.js"></script>
</body>
</html>
